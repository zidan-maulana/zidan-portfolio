<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="orbit-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="phone-glow" x1="280" y1="120" x2="520" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <filter id="shadow" x="240" y="100" width="320" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#orbit-bg)" />
  <circle cx="400" cy="250" r="180" stroke="#27272A" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />
  <circle cx="400" cy="250" r="130" stroke="#3F3F46" stroke-width="1" opacity="0.4" />
  <g filter="url(#shadow)" transform="rotate(-6 400 250)">
    <rect x="270" y="130" width="260" height="240" rx="28" fill="url(#phone-glow)" stroke="#3F3F46" stroke-width="1.5" />
    <rect x="282" y="142" width="236" height="216" rx="20" fill="#FFFFFF" />
    <text x="320" y="235" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#09090B" letter-spacing="-0.03em">Orbit SaaS</text>
    <text x="320" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#71717A">Analytics &amp; Intelligence</text>
    <rect x="320" y="290" width="160" height="6" rx="3" fill="#E4E4E7" />
    <rect x="320" y="306" width="100" height="6" rx="3" fill="#F4F4F5" />
  </g>
</svg>

