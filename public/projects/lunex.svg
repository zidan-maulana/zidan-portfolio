<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="lun-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <filter id="laptop-shadow" x="180" y="80" width="440" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#lun-bg)" />
  {/* Studio Grid Table */}
  <line x1="0" y1="360" x2="800" y2="360" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.5" />
  <line x1="0" y1="410" x2="800" y2="410" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" />
  <g filter="url(#laptop-shadow)">
    {/* Screen */}
    <rect x="240" y="100" width="320" height="200" rx="14" fill="#111827" stroke="#374151" stroke-width="2" />
    <rect x="250" y="110" width="300" height="180" rx="8" fill="#FFFFFF" />
    <text x="400" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#000000" letter-spacing="-0.04em">LUNEX</text>
    <text x="400" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280" letter-spacing="0.15em">WORKSPACE REDESIGN</text>
    <rect x="360" y="235" width="80" height="2" fill="#000000" />
    {/* Base */}
    <path d="M210 300 L590 300 L560 318 L240 318 Z" fill="#9CA3AF" stroke="#6B7280" stroke-width="1" />
    <rect x="375" y="300" width="50" height="5" rx="2" fill="#4B5563" />
  </g>
</svg>

